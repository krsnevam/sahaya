<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SAHAAYA: an outcome-financed platform for sustainable digital financial inclusion, measuring the moment a household no longer needs help.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SAHAAYA Inclusion Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wght@500;600&family=Anek+Latin:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: left rail + working canvas; each view leads with a summary band, detail below.
   The journey ramp (one hue, light to dark) is the only saturated colour; status colours are reserved for flags. */
:root{
  --bg:#f3f5f3; --surface:#fcfdfc; --sunken:#eaeeec; --ink:#101b18; --ink-2:#44504c; --ink-3:#6f7b76;
  --line:#dfe5e2; --line-2:#c3ccc8; --scrim:rgba(10,18,16,.46);
  --accent:#0b6a62; --accent-hover:#085850; --on-accent:#ffffff; --accent-soft:#dcefec; --accent-text:#0a5f58;
  --st0:#68c0b6; --st1:#3aa89c; --st2:#138a81; --st3:#0b6861; --st4:#06443f; --ser-n:#9aa5a0;
  --good:#0ca30c; --good-text:#006300; --good-soft:#e2f3e2;
  --warn:#fab219; --warn-text:#7a5200; --warn-soft:#fdf1d3;
  --crit:#d03b3b; --crit-text:#a82a2a; --crit-soft:#fae3e1;
  --shadow:0 12px 36px rgba(16,27,24,.16);
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Anek Latin","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1110; --surface:#151b19; --sunken:#1d2523; --ink:#eef2f0; --ink-2:#bcc6c2; --ink-3:#8a9691;
    --line:#27302d; --line-2:#3a4541; --scrim:rgba(0,0,0,.6);
    --accent:#3fb5a8; --accent-hover:#58c4b8; --on-accent:#04201d; --accent-soft:#14302c; --accent-text:#66cdc1;
    --st0:#0f5f58; --st1:#16807a; --st2:#2aa398; --st3:#5cc3b8; --st4:#9adfd6; --ser-n:#66716d;
    --good:#0ca30c; --good-text:#5fd45f; --good-soft:#12301a;
    --warn:#fab219; --warn-text:#f5c04a; --warn-soft:#33290f;
    --crit:#d03b3b; --crit-text:#f08a84; --crit-soft:#3a1a19;
    --shadow:0 12px 36px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1110; --surface:#151b19; --sunken:#1d2523; --ink:#eef2f0; --ink-2:#bcc6c2; --ink-3:#8a9691;
  --line:#27302d; --line-2:#3a4541; --scrim:rgba(0,0,0,.6);
  --accent:#3fb5a8; --accent-hover:#58c4b8; --on-accent:#04201d; --accent-soft:#14302c; --accent-text:#66cdc1;
  --st0:#0f5f58; --st1:#16807a; --st2:#2aa398; --st3:#5cc3b8; --st4:#9adfd6; --ser-n:#66716d;
  --good:#0ca30c; --good-text:#5fd45f; --good-soft:#12301a;
  --warn:#fab219; --warn-text:#f5c04a; --warn-soft:#33290f;
  --crit:#d03b3b; --crit-text:#f08a84; --crit-soft:#3a1a19;
  --shadow:0 12px 36px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-size:.93em;letter-spacing:-.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)} .nowrap{white-space:nowrap}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;
  padding:18px 12px 14px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 20px/1 "Anek Kannada",var(--font-display);padding-top:2px;flex:none}
.brand-name{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-name b{font:700 17px/1.1 var(--font-display);letter-spacing:.04em}
.brand-name span{font:600 12px/1.2 "Anek Kannada",var(--font-ui);color:var(--ink-3)}
.ws{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left}
.ws:hover{border-color:var(--line-2)}
.ws-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.ws.live .ws-dot{background:var(--good)}
.ws b{display:block;font-weight:600;font-size:13px;line-height:1.25}
.ws small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13.5px;white-space:nowrap}
.nav a:hover{background:var(--sunken);text-decoration:none}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--surface);font:600 11px/20px var(--font-ui);text-align:center}
.rail-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.rail-foot b{color:var(--ink-2);font-weight:500}
.main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.main{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (max-width:899px){
  .app{display:block}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:column;gap:8px;padding:10px 0 0;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .rail-top{display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail-top .brand{padding:0;flex:1;min-width:0}
  .ws{width:auto;padding:6px 10px} .ws small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{height:38px;border-radius:0;border-bottom:2px solid transparent;padding:0 10px}
  .nav a .ico{display:none}
  .nav a[aria-current="page"]{background:none;border-bottom-color:var(--accent)}
  .nav .badge{margin-left:6px}
  .rail-foot{display:none}
  .main{padding-block:18px 56px}
}
@media (min-width:900px){.rail-top{display:contents}}

/* page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.page-head h1{font:600 27px/1.15 var(--font-display);letter-spacing:-.005em;text-wrap:balance}
.page-head .sub{color:var(--ink-3);font-size:13px;margin-top:3px;max-width:68ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;padding:14px 18px 0;flex-wrap:wrap}
.panel-head h2{font:600 15.5px/1.3 var(--font-display)}
.panel-head .hint{margin-top:1px}
.panel-body{padding:12px 18px 18px}
.panel-body.flush{padding:8px 0 4px}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1040px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:12px;color:var(--ink-3);line-height:1.45}

/* stats band */
.stats{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
.stat{background:var(--surface);padding:14px 16px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:500;line-height:1.3}
.stat .v{font:600 23px/1.2 var(--font-ui);letter-spacing:-.01em}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:3px}
.stat .d{font-size:12px;color:var(--ink-3);line-height:1.4}
@media (max-width:1100px){.stats{grid-template-columns:repeat(var(--nm,3),minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:0}
.hero-main{padding:22px 24px 22px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.hero-num{font:600 60px/1 var(--font-ui);letter-spacing:-.03em;margin-top:4px}
.hero-num span{font-size:30px;letter-spacing:0;margin-left:2px;color:var(--ink-2)}
.hero-main p{max-width:40ch;color:var(--ink-2)}
.hero-side{padding:18px 22px 20px;min-width:0}
.hero-side h2{font:600 15.5px/1.3 var(--font-display);margin-bottom:12px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.hero-main{border-right:0;border-bottom:1px solid var(--line)}.hero-num{font-size:52px}}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px}
.f-row{display:grid;grid-template-columns:168px minmax(0,1fr) 84px;align-items:center;gap:12px}
.f-label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.f-track{height:20px;display:flex}
.f-bar{height:100%;min-width:2px;border-radius:0 4px 4px 0}
.f-val{font-variant-numeric:tabular-nums;font-size:13px;display:flex;justify-content:flex-end;gap:8px;white-space:nowrap}
.f-val b{font-weight:600} .f-val span{color:var(--ink-3);min-width:34px;text-align:right}
@media (max-width:560px){.f-row{grid-template-columns:minmax(0,1fr) auto;gap:3px 10px}.f-label{grid-column:1}.f-val{grid-column:2;grid-row:1}.f-track{grid-column:1/-1;height:14px}}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--ink-3))}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .key{width:14px;height:2px;border-radius:1px;background:var(--c)}
.legend .sw{width:9px;height:9px;border-radius:2px;background:var(--c)}
.segbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;min-width:90px}
.segbar i{display:block;height:100%;min-width:2px}
.meter{height:6px;border-radius:3px;background:var(--accent-soft);min-width:48px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--st2)}

/* charts */
.chart{width:100%;min-height:60px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11.5px var(--font-ui);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart text.val{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .hit .on{opacity:0}
.chart .hit:hover .on,.chart .hit:focus .on{opacity:1}
.chart .hit:focus{outline:none}
details.tblview{margin-top:10px;font-size:12px}
details.tblview summary{cursor:pointer;color:var(--ink-3);width:max-content}
details.tblview summary:hover{color:var(--ink-2)}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}
.tbl th:last-child,.tbl td:last-child{padding-right:18px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--sunken)}
.tbl td small{display:block;color:var(--ink-3);font-size:12px;line-height:1.35}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.pager div{display:flex;gap:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:999px;font-size:12px;line-height:18px;background:var(--sunken);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip .ico{width:13px;height:13px}
.chip.good{background:var(--good-soft);color:var(--good-text)}
.chip.warn{background:var(--warn-soft);color:var(--warn-text)}
.chip.crit{background:var(--crit-soft);color:var(--crit-text)}
.chip.accent{background:var(--accent-soft);color:var(--accent-text)}
.flag{display:inline-flex;align-items:flex-start;gap:6px;font-size:13px;line-height:1.35}
.flag .ico{margin-top:1px;width:14px;height:14px}
.flag.high .ico{color:var(--crit-text)} .flag.medium .ico{color:var(--warn-text)} .flag.low .ico,.flag.none .ico{color:var(--ink-3)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunken);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit-text)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.icon{width:32px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--surface);gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:28px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--sunken)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.input{height:36px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 10px;font-size:14px;width:100%;min-width:0}
.filters .input{height:32px;font-size:13px;width:auto}
.filters .search{flex:1 1 180px;max-width:260px}
textarea.input{height:auto;padding:8px 10px;font:12px/1.5 var(--font-mono);resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:12px;font-weight:500;color:var(--ink-2)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:540px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink-2);line-height:1.45}
.check input{margin:3px 0 0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.radio-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.radio-card{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;font-size:13px;line-height:1.35}
.radio-card input{margin:2px 0 0;accent-color:var(--accent)}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card b{display:block;font-weight:600} .radio-card span{color:var(--ink-3);font-size:12px}
.err{color:var(--crit-text);font-size:13px;display:flex;gap:6px;align-items:flex-start}

/* notes, lists */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--sunken);font-size:13px;color:var(--ink-2);line-height:1.45}
.note .ico{margin-top:2px}
.note.warn{background:var(--warn-soft);color:var(--warn-text)} .note.good{background:var(--good-soft);color:var(--good-text)} .note.crit{background:var(--crit-soft);color:var(--crit-text)}
.note b{font-weight:600}
.attn{display:flex;flex-direction:column}
.attn a{display:grid;grid-template-columns:18px minmax(0,1fr) 16px;gap:10px;padding:11px 18px;border-top:1px solid var(--line);color:inherit;align-items:start}
.attn a:first-child{border-top:0}
.attn a:hover{background:var(--sunken);text-decoration:none}
.attn b{display:block;font-weight:600;font-size:13px;line-height:1.35}
.attn span{display:block;font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:1px}
.attn .ico{margin-top:2px}
.attn .t-crit{color:var(--crit-text)} .attn .t-warn{color:var(--warn-text)} .attn .t-info{color:var(--accent-text)} .attn .go{color:var(--ink-3)}
.rules{counter-reset:r;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--ink-2);line-height:1.5}
.rules li{counter-increment:r;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.rules li::before{content:counter(r);width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font:600 11.5px/20px var(--font-ui);text-align:center;margin-top:1px}
.rules b{color:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px}
.kv div{min-width:0} .kv dt{font-size:12px;color:var(--ink-3)} .kv dd{font-size:13.5px;font-weight:500}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-3)}
.empty b{color:var(--ink);font:600 16px/1.3 var(--font-display)} .empty p{max-width:46ch} .empty .btn{margin-top:6px}

/* field list */
.visit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:13px 18px;border-top:1px solid var(--line);align-items:start}
.visit:first-child{border-top:0}
.visit-top{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}

function colChart(el, rows, series, o) {

    r.values.forEach((v, j) => {

    });

  const stats = SH.ambassadorStats(state, D, now).filter(s => s.a.active !== false), all = SH.metrics(SH.eligible(D), now);
  let lv = { explain: 0, prompt: 0, watch: 0 }, alone = 0;
  for (const d of SH.eligible(D)) for (const s of d.sessions) { if (s.data.mode === 'assisted') lv[s.data.level || 'prompt']++; else alone++; }
  const tot = lv.explain + lv.prompt + lv.watch + alone;
  let h = statsBand([
    stat('Active Ambassadors', fmtN(n), 'across ' + plural(state.villages.length, 'Gram Panchayat')),
    stat('Women', fmtPct(SH.ratio(act.filter(a => a.gender === 'f').length, n)), 'prioritised in recruitment'),
    stat('Youth, 18 to 29', fmtPct(SH.ratio(act.filter(a => a.youth).length, n)), 'prioritised in recruitment'),
    stat('Live in their Panchayat', fmtPct(SH.ratio(act.filter(a => a.local !== false).length, n)), 'so monsoon and terrain do not stop visits'),
    stat('Fully trained', fmtN(stats.filter(s => s.fullyTrained).length) + '<small>of ' + n + '</small>', SH.TRAINING.length + ' modules each')
  ], 5, 3);
  h += '<div class="cols even"><section class="panel"><div class="panel-head"><h2>Code of conduct</h2></div><div class="panel-body"><ol class="rules">' +
    '<li><span><b>Never transact on anyone’s behalf.</b> The household member holds the phone and makes every payment. A task the Ambassador performed is not a session and is not recorded.</span></li>' +
    '<li><span><b>Never ask for, see or record a PIN, OTP or password.</b> Look away when it is entered. Notes that look like a PIN, OTP, phone number or UPI ID are refused by the platform.</span></li>' +
    '<li><span><b>Step back on purpose.</b> Explain, then prompt, then only watch, then leave the household to do it alone.</span></li>' +
    '<li><span><b>Record honestly.</b> Self-reported use is never evidence. Only partner records, cohort reconciliation, transaction references and independent audits count.</span></li>' +
    '<li><span><b>Success is being needed less.</b> Ambassadors are measured by how quickly households stop needing them, not by sessions run.</span></li></ol></div></section>' +
    '<section class="panel"><div class="panel-head"><div><h2>The step-back ladder</h2><p class="hint">Every recorded session, by how much help was given.</p></div></div><div class="panel-body"><div class="ladder">' +
    [['Explain', lv.explain, 'Ambassador explains each screen; they tap', 1], ['Prompt', lv.prompt, 'They lead; prompts only when stuck', 2], ['Watch', lv.watch, 'They do it; Ambassador only watches', 3], ['Alone', alone, 'Independent use, no Ambassador help', 4]].map((x, i) =>
      '<div class="rung"><i style="--c:' + sc(x[3]) + '"></i><div><b>' + x[0] + '</b><small>' + x[2] + '</small></div><span class="num">' + fmtN(x[1]) + '<small>' + fmtPct(SH.ratio(x[1], tot)) + '</small></span></div>').join('') +
    '</div><p class="hint" style="margin-top:10px">Across the cohort, ' + fmtPct(all.watchShare) + ' of assisted sessions are already at the watch-only step.</p></div></section></div>';
  h += '<section class="panel"><div class="panel-head"><div><h2>Measured by independence, not activity</h2><p class="hint">Sessions run are shown for planning only. They are not a performance measure.</p></div><a class="btn sm" href="#setup">' + ico('plus') + 'Recruit in Setup</a></div><div class="panel-body flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ambassador</th><th>Profile</th><th>Training</th><th class="num">Households</th><th class="num">No longer need help</th><th class="num">Handover rate</th><th class="num">Days to independence</th><th class="num">Sessions run</th></tr></thead><tbody>' +
    stats.map(s => '<tr><td><b>' + esc(s.a.name) + '</b><small>' + esc(villageName(s.a.village)) + '</small></td><td>' + esc([s.a.gender === 'f' ? 'Woman' : s.a.gender === 'm' ? 'Man' : '', s.a.youth ? 'youth' : '', s.a.local !== false ? 'lives locally' : 'not local'].filter(Boolean).join(', ')) + '</td>' +
      '<td>' + (s.fullyTrained ? '<span class="chip good">' + ico('ok') + 'All ' + SH.TRAINING.length + '</span>' : '<button type="button" class="btn sm" data-action="training" data-id="' + s.a.id + '">' + s.trained + ' of ' + SH.TRAINING.length + ': record</button>') + '</td>' +
      '<td class="num">' + fmtN(s.households) + '</td><td class="num"><b>' + fmtN(s.reached[4]) + '</b><small>' + fmtPct(s.idfir) + '</small></td><td class="num">' + fmtPct(s.transition) + '</td><td class="num">' + (s.medianDays == null ? '–' : Math.round(s.medianDays)) + '</td><td class="num muted">' + fmtN(s.sessions) + '</td></tr>').join('') +
    '</tbody></table></div></div></section>';
  return h;
}

    j.steps.map((s, i) => '<li class="jcard"><div class="jtop"><span class="jnum">' + (i + 1) + '</span><span class="jico">' + ico(s[0]) + '</span></div>' + (lang !== 'en' ? '<p lang="kn" class="kn">' + esc(s[2]) + '</p>' : '') + (lang !== 'kn' ? '<p class="' + (lang === 'both' ? 'en' : 'kn-size') + '">' + esc(s[1]) + '</p>' : '') + '</li>').join('') +

/* ----- Verification ----- */
function evidenceText(d) {
  if (d.basis === 'partner_report') return 'Active in ' + d.reportPeriods.slice(-4).map(p => SH.monthLabel(p, true)).join(', ') + ' (partner rows)';
  if (d.basis === 'cohort') return 'Independent use in ' + d.cohortMonths.slice(-4).map(p => SH.monthLabel(p, true)).join(', ') + ', reconciled against cohort totals';
  if (d.basis === 'reference') return d.refTxns + ' references across ' + plural(d.refMonths, 'month');
  return d.indep + ' tasks recorded, ' + (d.refTxns ? d.refTxns + ' with a reference' : 'none with a reference');
}
views.verification = () => {
  const list = SH.eligible(D), R = state.settings.rules, c = { awaiting: 0, ready: 0, audit: 0, verified: 0, rejected: 0 };
  const claims = list.filter(d => d.claim); claims.forEach(d => c[d.claim]++);
  const byBasis = { partner_report: 0, cohort: 0, reference: 0 }; for (const d of list) if (d.verifiedAt && byBasis[d.verifiedBasis] != null) byBasis[d.verifiedBasis]++;
  let pass = 0, fail = 0; for (const d of list) if (d.audit) { if (d.audit.state === 'pass') pass++; else if (d.audit.state === 'fail') fail++; }
  let h = pageHead('Verification', 'The Outcome Verification Engine decides whether independence actually happened. Self-reported use and training attendance never count.',
    '<button type="button" class="btn" data-action="import-report">' + ico('upload') + 'Import partner evidence</button><button type="button" class="btn primary" data-action="run-verification"' + (c.ready ? '' : ' disabled') + '>' + ico('verification') + 'Run verification' + (c.ready ? ' (' + c.ready + ')' : '') + '</button>');
  h += statsBand([
    stat('Awaiting evidence', fmtN(c.awaiting), 'meet the rule, no qualifying evidence yet'),
    stat('Ready to verify', fmtN(c.ready), 'evidence matched, waiting for a run'),
    stat('In audit', fmtN(c.audit), 'sampled, waiting for an auditor'),
    stat('Verified', fmtN(c.verified), 'outcomes issued to date'),
    stat('Not upheld', fmtN(c.rejected), 'claims an audit did not confirm'),
    stat('Audit pass rate', pass + fail ? fmtPct(pass / (pass + fail)) : '–', plural(pass + fail, 'audit') + ' completed')
  ], 6, 3);
  const prev = SH.addMonths(SH.monthKey(now), -1);
  const hasRows = state.reports.some(r => r.kind !== 'cohort'), hasCoh = state.reports.some(r => r.kind === 'cohort');
  const missRows = state.households.length && (hasRows || !hasCoh) && !state.reports.some(r => r.period === prev && r.kind !== 'cohort');
  const missCoh = hasCoh && !state.reports.some(r => r.period === prev && r.kind === 'cohort');
  h += '<div class="cols even"><section class="panel"><div class="panel-head"><h2>Verification hierarchy</h2><a class="btn sm ghost" href="#setup">Change rules</a></div><div class="panel-body stack">' +
    '<p class="ink2" style="font-size:13px">A claim opens when a household completes at least <b>' + R.repeatMinTxns + ' tasks without help in at least ' + R.repeatMinMonths + ' calendar months</b>. It is then tested against the highest tier of evidence available.</p><ol class="rules tiers">' +
    '<li><span><b>Institutional or platform evidence, where legally shareable.</b> The partner’s monthly rows show the account digitally active in ' + R.repeatMinMonths + '+ months, for households that consented. ' + R.auditRate + '% audited.<em>' + plural(byBasis.partner_report, 'outcome') + '</em></span></li>' +
    '<li><span><b>Cohort-level reconciliation using pseudonymous IDs.</b> Where rows cannot be shared, the partner returns only how many of a cohort’s references were active. Our claims for that month must not exceed it. ' + R.auditRateCohort + '% audited.<em>' + plural(byBasis.cohort, 'outcome') + '</em></span></li>' +
    '<li><span><b>Defined evidence rules where direct data is unavailable.</b> At least ' + R.repeatMinTxns + ' transaction references, recorded as the last 4 to 6 characters, across ' + R.repeatMinMonths + ' months. ' + R.auditRateRef + '% audited.<em>' + plural(byBasis.reference, 'outcome') + '</em></span></li>' +
    '<li><span><b>Independent sample-based audit.</b> Applied on top of every tier. The auditor visits without the Ambassador and confirms the person performed the task themselves.<em>' + plural(pass + fail, 'audit') + ', ' + fmtPct(SH.ratio(pass, pass + fail)) + ' confirmed</em></span></li></ol></div></section>' +
    '<section class="panel"><div class="panel-head"><h2>Partner evidence</h2></div><div class="panel-body flush">' +
    (missRows ? '<div style="padding:4px 18px 8px"><div class="note warn">' + ico('alert') + '<span><b>' + SH.monthLabel(prev) + ' partner rows have not been imported.</b> Claims that depend on them stay in Awaiting evidence.</span></div></div>' : '') +
    (missCoh ? '<div style="padding:4px 18px 8px"><div class="note warn">' + ico('alert') + '<span><b>' + SH.monthLabel(prev) + ' cohort totals have not been imported.</b> Cohorts verified at cohort level cannot use that month yet.</span></div></div>' : '') +
    (state.reports.length ? '<div class="tbl-wrap" style="max-height:340px;overflow-y:auto"><table class="tbl"><thead><tr><th>Period and source</th><th>Kind</th><th class="num">Matched</th><th class="num">Active</th></tr></thead><tbody>' +
      state.reports.slice().reverse().map(r => '<tr><td><b>' + SH.monthLabel(r.period) + '</b><small>' + esc(r.source) + ' · imported ' + fmtDay(r.importedAt) + '</small></td><td class="nowrap">' + (r.kind === 'cohort' ? 'Tier 2: cohort totals' : 'Tier 1: household rows') + '</td><td class="num">' + (r.kind === 'cohort' ? plural(r.matched, 'cohort') : r.matched) + '</td><td class="num">' + (r.kind === 'cohort' ? r.active + ' of ' + r.sent : r.active) + '</td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty"><b>No partner evidence yet</b><p>A partner sends either one row per household reference for a month, or cohort totals where rows cannot be shared. Import the first file when it arrives.</p></div>') +
    '</div></section></div>';
  const rec = (D.recon || []).filter(r => r.arm === 'programme').slice().reverse();
  if (rec.length) h += '<section class="panel"><div class="panel-head"><div><h2>Cohort reconciliation</h2><p class="hint">Tier 2. A month is reconciled when the households we record as independently active do not exceed the active references the partner found in that cohort. An over-claimed month cannot support any outcome.</p></div></div><div class="panel-body flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Period</th><th>Cohort</th><th class="num">References sent</th><th class="num">Active, per partner</th><th class="num">Independently active, per our records</th><th>Result</th></tr></thead><tbody>' +
    rec.map(r => '<tr><td class="nowrap"><b>' + SH.monthLabel(r.period) + '</b></td><td>' + esc(villageName(r.village)) + ' programme <span class="mono hint">' + r.key + '</span></td><td class="num">' + r.sent + '</td><td class="num">' + r.active + '</td><td class="num">' + r.claimed + '</td><td>' + (r.ok ? '<span class="chip good">' + ico('ok') + 'Reconciled</span>' : '<span class="chip crit">' + ico('stop') + 'Over-claim by ' + (r.claimed - r.active) + '</span>') + '</td></tr>').join('') + '</tbody></table></div></div></section>';
  const audits = list.filter(d => d.claim === 'audit').sort((a, b) => a.audit.at - b.audit.at);
  h += '<section class="panel"><div class="panel-head"><div class="seg" role="group" aria-label="Claims"><button type="button" data-action="set" data-key="ver.tab" data-val="audit" aria-pressed="' + (ui.ver.tab === 'audit') + '">Audit queue (' + audits.length + ')</button><button type="button" data-action="set" data-key="ver.tab" data-val="claims" aria-pressed="' + (ui.ver.tab === 'claims') + '">All claims (' + claims.length + ')</button></div>' +
    (ui.ver.tab === 'claims' ? select('ver-status', [['all', 'All statuses']].concat(Object.keys(CLAIM).map(k => [k, CLAIM[k][0]])), ui.ver.status, 'data-set="ver.status" aria-label="Status" style="width:auto;height:32px;font-size:13px"') : '') + '</div><div class="panel-body flush">';
  if (ui.ver.tab === 'audit') {
    h += audits.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Household</th><th>Evidence</th><th>Tier</th><th>Selected</th><th></th></tr></thead><tbody>' +
      audits.map(d => '<tr><td>' + linkBtn(d.id) + '<small>' + esc(villageName(d.h.village)) + ' · ' + esc(ambName(d.h.ambassador)) + '</small></td><td>' + esc(evidenceText(Object.assign({}, d, { basis: d.audit.basis || d.basis }))) + '</td><td class="nowrap">' + esc((BASIS[d.audit.basis] || '').split(':')[0]) + '</td><td class="nowrap">' + fmtDate(d.audit.at) + '</td><td class="num"><button type="button" class="btn sm primary" data-action="audit" data-id="' + d.id + '">Record result</button></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty"><b>No audits waiting</b><p>Claims sampled for audit appear here after a verification run.</p></div>';
  } else {
    const f = claims.filter(d => ui.ver.status === 'all' || d.claim === ui.ver.status).sort((a, b) => (b.verifiedAt || b.rejectedAt || b.repeatAt) - (a.verifiedAt || a.rejectedAt || a.repeatAt));
    const size = 15, pages = Math.max(1, Math.ceil(f.length / size)); if (ui.ver.page >= pages) ui.ver.page = pages - 1;
    h += f.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Household</th><th>Rule met</th><th>Evidence</th><th>Status</th><th>Decided</th></tr></thead><tbody>' +
      f.slice(ui.ver.page * size, ui.ver.page * size + size).map(d => '<tr><td>' + linkBtn(d.id) + '<small>' + esc(villageName(d.h.village)) + '</small></td><td class="nowrap">' + fmtDate(d.repeatAt) + '</td><td>' + esc(d.verifiedAt ? (BASIS[d.verifiedBasis] || '') : evidenceText(d)) + '</td><td>' + claimChip(d.claim) + '</td><td class="nowrap">' + fmtDate(d.verifiedAt || d.rejectedAt) + '</td></tr>').join('') + '</tbody></table></div>' + pager(f.length, ui.ver.page, size, 'ver')
      : '<div class="empty"><b>No claims' + (ui.ver.status === 'all' ? ' yet' : ' with this status') + '</b><p>A claim opens when a household meets the repeat-use rule.</p></div>';
  }
  return h + '</div></section>';
};

/* ----- Ledger ----- */
function ledgerFiltered() { const f = ui.ledger, q = f.q.trim().toUpperCase(); return state.events.filter(e => (f.type === 'all' || e.type === f.type) && (!q || (e.hh || '').indexOf(q) >= 0)); }
function ledgerListHtml() {
  const list = ledgerFiltered(), size = 50, pages = Math.max(1, Math.ceil(list.length / size));
  if (ui.ledger.page >= pages) ui.ledger.page = pages - 1;
  if (!list.length) return '<div class="empty"><b>No entries' + (state.events.length ? ' match' : ' yet') + '</b><p>' + (state.events.length ? 'Change the filter or clear the search.' : 'Every enrolment, session, report import and verification decision is written here.') + '</p></div>';
  const end = list.length - ui.ledger.page * size, rows = list.slice(Math.max(0, end - size), end).reverse();
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="num">No.</th><th>Date</th><th>Household</th><th>Entry</th><th>Recorded by</th><th>Hash</th></tr></thead><tbody>' +
    rows.map(e => { const t = eventText(e); return '<tr><td class="num">' + fmtN(e.seq) + '</td><td class="nowrap">' + fmtDate(e.ts) + (Math.abs(e.at - e.ts) > DAY ? '<small>recorded ' + fmtDay(e.at) + '</small>' : '') + '</td><td>' + (e.hh ? linkBtn(e.hh) : '<span class="muted">Programme</span>') + '</td><td><b>' + esc(t[0]) + '</b><small>' + esc(t[1]) + '</small></td><td class="nowrap">' + esc(e.by ? ambName(e.by) : '') + '</td><td><span class="hash" data-tip="' + e.hash + '">' + e.hash.slice(0, 10) + '</span></td></tr>'; }).join('') +
    '</tbody></table></div>' + pager(list.length, ui.ledger.page, size, 'ledger');
}
views.ledger = () => {
  const ck = ui.ledger.check, head = state.events.length ? state.events[state.events.length - 1].hash : '';
  let h = pageHead('Ledger', 'An append-only record. Each entry carries a SHA-256 hash of itself and the entry before it, so any later change breaks the chain.', '<button type="button" class="btn" data-action="export-ledger">' + ico('download') + 'Export CSV</button><button type="button" class="btn primary" data-action="check-ledger">' + ico('verification') + 'Check integrity</button>');
  h += '<section class="panel"><div class="panel-body split" style="padding-top:14px"><div><div class="eyebrow">Chain head</div><div class="mono" style="margin-top:4px;word-break:break-all">' + (head || 'No entries yet') + '</div></div><div>' +
    (ck ? (ck.ok ? '<div class="note good">' + ico('ok') + '<span><b>Chain intact.</b> All ' + fmtN(ck.count) + ' entries re-hashed and matched at ' + tF.format(ck.at) + '.</span></div>' : '<div class="note crit">' + ico('stop') + '<span><b>Chain broken at entry ' + fmtN(ck.brokenAt) + '.</b> That entry or one before it was changed after it was written.</span></div>') : '<span class="hint">' + fmtN(state.events.length) + ' entries. Not checked in this session.</span>') + '</div></div></section>';

    '<input class="input search" id="ledger-q" type="search" placeholder="Filter by household reference" aria-label="Filter by household reference" value="' + esc(ui.ledger.q) + '" data-live="ledger.q"></div><div id="ledger-list">' + ledgerListHtml() + '</div></section>';

    '<div><b>' + ico('households') + 'Data minimisation</b><p>A household is a pseudonymous reference such as <span class="mono">SH-AMM-0042</span>, its Panchayat, a profile in bands (gender, age band, device, account status, language, ST, accessibility), three survey answers, and its session record. Nothing else.</p></div>' +

};

function priceTestOut() {

  if (!r.ok) return '<p class="hint">Needs a test price, and at least one full month of recurring cost and verified outcomes.</p>';
  return '<div class="bignum four"><div><b>' + fmtPct(r.opcr) + '</b><span>coverage at ' + inr(+pt.price) + ', on the last ' + plural(fin.fullMonths, 'full month') + '</span></div><div><b>' + inr(r.targetPrice) + '</b><span>price that reaches the ' + R.opcrTarget + '% target</span></div><div><b>' + inr(r.breakEven) + '</b><span>break-even price: full recurring cost</span></div><div><b>' + fmtX(r.roi) + '</b><span>payer ROI at this price' + (value ? ', ' + inr(value) + ' value' : '') + '</span></div></div>' +
    '<p class="hint">' + fin.verAvg.toFixed(1) + ' outcomes verified and ' + inr(fin.recurAvg) + ' recurring cost a month, on average. Coverage rises as verification volume grows, so the price is retested each quarter.</p>';
}

const forms = {
  enrol(fd) {
    const arm = fd.get('arm') === 'comparison' ? 'comparison' : 'programme';
    if (arm === 'programme' && !fd.get('ambassador')) return 'Choose the Ambassador who enrolled the household, or add one in Setup.';
    if (!fd.get('b_payer') || !fd.get('b_pin') || !fd.get('b_internet')) return 'Answer all three baseline questions before enrolling. They are the starting point every result is measured against.';
    if (!fd.get('consent_journey')) return 'Enrolment needs the participant’s consent to the household record.';
    const ts = dateToTs(fd.get('date'));
    if (ts == null) return 'Enter the enrolment date.';
    if (ts > Date.now()) return 'The enrolment date cannot be in the future.';
    const h = SH.enrolHousehold(state, {
      village: fd.get('village'), arm, ambassador: fd.get('ambassador'), by: ui.operator, ts, scope: fd.get('consent_match') ? ['journey', 'partner_match'] : ['journey'],
      profile: { gender: fd.get('gender'), age: fd.get('age'), firstTime: fd.get('firstTime') === 'yes', device: fd.get('device'), account: fd.get('account'), language: fd.get('language'), tribal: !!fd.get('tribal'), access: fd.get('access') || 'none', vulnerable: !!fd.get('vulnerable') },
      baseline: { payer: fd.get('b_payer'), pin: fd.get('b_pin'), internet: fd.get('b_internet') }
    }, Date.now());
    closeModal(); ui.drawer = h.id; commit(); toast((arm === 'comparison' ? 'Enrolled in the comparison cohort: ' : 'Enrolled ') + h.id);
  },
  session(fd) {
    const hh = String(fd.get('hh') || '').trim().toUpperCase(), d = D.get(hh);
    if (!d) return 'Enter a household reference that is enrolled, such as SH-AMM-0001.';
    if (d.withdrawn) return 'This household withdrew consent. No further sessions can be recorded.';
    if (d.arm === 'comparison') return 'This household is in the comparison cohort. It gets no sessions until the delayed intervention starts.';
    if (!fd.get('by')) return 'Choose who recorded the session.';
    const ts = dateToTs(fd.get('date'));
    if (ts == null) return 'Enter the date of the task.';
    if (ts > Date.now()) return 'The date cannot be in the future.';
    if (isoDay(ts) < isoDay(d.h.onboardedAt)) return 'The date is before this household enrolled on ' + fmtDate(d.h.onboardedAt) + '.';
    const mode = fd.get('mode');
    if (!mode) return 'Say whether the task was assisted or independent.';
    if (!fd.get('declare')) return 'Confirm that you did not operate the phone or transact on the household’s behalf. If you did, do not record it as a session.';
    const noteErr = SH.sensitiveText(fd.get('note')); if (noteErr) return noteErr;
    let evidence, ref = '';
    if (mode === 'independent') {
      evidence = fd.get('evidence'); ref = String(fd.get('ref') || '').trim().toUpperCase();
      if (evidence === 'reference' && !/^[A-Z0-9]{4,6}$/.test(ref)) return 'Enter the last 4 to 6 characters of the transaction reference.';
      if (evidence !== 'reference') ref = '';
    }
    const before = d.stage;
    SH.logSession(state, { hh, by: fd.get('by'), ts, at: Date.now(), activity: fd.get('activity'), mode, level: fd.get('level') || 'prompt', evidence, ref, note: String(fd.get('note') || '').trim() });
    closeModal(); commit();
    const after = D.get(hh).stage;
    toast(after > before ? hh + ' moved to ' + SH.STAGES[after].label : 'Session recorded for ' + hh);
  },
  report(fd) {
    const p = SH.parseReportCsv(fd.get('csv'));
    if (!p.rows.length) return p.errors[0] || 'Paste the CSV contents or choose a file.';
    const known = new Set(state.households.map(h => h.id)), vs = new Set(state.villages.map(v => v.id));
    if (p.kind === 'cohort' ? !p.rows.some(r => vs.has(r.cohort.slice(0, 3))) : !p.rows.some(r => known.has(r.ref))) return p.kind === 'cohort' ? 'None of the cohorts in this file match a Gram Panchayat code.' : 'None of the references in this file match an enrolled household.';
    const reps = SH.importReport(state, p, String(fd.get('source') || 'Partner').trim() || 'Partner', ui.operator, Date.now());
    closeModal(); commit();
    toast('Imported ' + reps.map(r => SH.monthLabel(r.period)).join(', ') + (p.kind === 'cohort' ? ' cohort totals: ' + reps.reduce((s, r) => s + r.active, 0) + ' of ' + reps.reduce((s, r) => s + r.sent, 0) + ' references active' : ': ' + reps.reduce((s, r) => s + r.matched, 0) + ' rows matched, ' + reps.reduce((s, r) => s + r.active, 0) + ' active'));
  },
  audit(fd) {
    const result = fd.get('result'), note = String(fd.get('note') || '').trim(), by = String(fd.get('by') || '').trim();
    if (!result) return 'Choose whether the audit confirmed independent use.';
    if (!by) return 'Enter the auditor’s name.';
    if (result === 'fail' && !note) return 'Say what the auditor saw, so the Ambassador can follow up.';
    const noteErr = SH.sensitiveText(note); if (noteErr) return noteErr;
    const r = SH.recordAudit(state, fd.get('hh'), result, note, by, Date.now());
    if (!r) return 'This claim is no longer waiting for an audit.';
    closeModal(); commit(); toast(result === 'pass' ? 'Outcome verified for ' + fd.get('hh') : 'Claim not upheld for ' + fd.get('hh'));
  },
  agreement(fd) {
    const payer = String(fd.get('payer') || '').trim(), price = Math.round(+fd.get('unitPrice')), cap = Math.round(+fd.get('capOutcomes')) || null, val = Math.round(+fd.get('valuePerActive')) || null;
    const s = dateToTs(fd.get('start')), e = dateToTs(fd.get('end'));
    if (!payer) return 'Name the paying institution.';
    if (!(price > 0)) return 'Enter the price per verified household in rupees.';
    if (s == null || e == null) return 'Enter the start and end of the term.';
    const start = new Date(s).setHours(0, 0, 0, 0), end = new Date(e).setHours(23, 59, 59, 999);
    if (end <= start) return 'The term must end after it starts.';
    const id = fd.get('id');
    if (id) Object.assign(state.agreements.find(x => x.id === id), { payer, unitPrice: price, capOutcomes: cap, valuePerActive: val, start, end, note: String(fd.get('note') || '').trim() });
    else state.agreements.push({ id: nextId(state.agreements, 'OBSA-', 2), payer, status: 'draft', unitPrice: price, capOutcomes: cap, valuePerActive: val, start, end, createdAt: Date.now(), note: String(fd.get('note') || '').trim() });
    closeModal(); commit(); toast(id ? 'Terms saved' : 'Draft agreement created');
  },
  cost(fd) {
    const month = String(fd.get('month') || ''), amount = Math.round(+fd.get('amount'));
    if (!/^\d{4}-\d{2}$/.test(month)) return 'Choose the month the cost belongs to.';
    if (month > SH.monthKey(Date.now())) return 'The month cannot be in the future.';
    if (!(amount > 0)) return 'Enter the amount in rupees.';
    state.costs.push({ id: nextId(state.costs, 'C-', 3), month, category: fd.get('category'), amount, note: String(fd.get('note') || '').trim(), oneOff: !!fd.get('oneOff') });
    closeModal(); commit(); toast('Cost added for ' + SH.monthLabel(month));
  },
  ambassador(fd) {
    const name = String(fd.get('name') || '').trim();
    if (!name) return 'Enter the Ambassador’s name.';
    state.ambassadors.push({ id: nextId(state.ambassadors, 'DA-', 2), name, village: fd.get('village'), gender: fd.get('gender'), youth: fd.get('age') === 'youth', local: !!fd.get('local'), since: Date.now(), active: true, training: {} });
    closeModal(); commit(); toast(name + ' added');
  },
  village(fd) {
    const name = String(fd.get('name') || '').trim(), code = String(fd.get('code') || '').trim().toUpperCase();
    if (!name) return 'Enter the Gram Panchayat’s name.';
    if (!/^[A-Z]{3}$/.test(code)) return 'The code must be three letters.';
    if (state.villages.some(v => v.id === code)) return 'That code is already used by ' + villageName(code) + '.';
    state.villages.push({ id: code, name, kn: String(fd.get('kn') || '').trim() || undefined, connectivity: fd.get('connectivity') || 'unknown', engaged: false });
    closeModal(); commit(); toast(name + ' added');
  },
  rules(fd) {
    const R = {}, lim = { repeatMinTxns: [1, 12], repeatMinMonths: [1, 6], followUpDays: [30, 365], auditRate: [0, 100], auditRateCohort: [0, 100], auditRateRef: [0, 100], stallSessions: [1, 12], stallDays: [5, 120], dormantDays: [5, 120], monsoonExtraDays: [0, 60], opcrTarget: [1, 200], gateIdfir: [1, 100], gateRetention: [1, 100], gateAuditPass: [1, 100], gateMinAudits: [1, 500] };
    for (const k in lim) { const v = Math.round(+fd.get(k)); if (!(v >= lim[k][0] && v <= lim[k][1])) return 'Each value must be a whole number inside its allowed range (' + k + ': ' + lim[k][0] + ' to ' + lim[k][1] + ').'; R[k] = v; }
    if (R.repeatMinMonths > R.repeatMinTxns) return 'Months required cannot be more than tasks required.';
    state.settings.rules = R; commit(); toast('Outcome rule saved');
  },
  followup(fd) {
    const hh = fd.get('hh'), d = D.get(hh), ts = dateToTs(fd.get('date')), by = String(fd.get('by') || '').trim();
    if (!d) return 'This household is no longer in the workspace.';
    if (!fd.get('payer') || !fd.get('pin') || !fd.get('internet')) return 'Answer all three questions.';
    if (ts == null) return 'Enter the survey date.';
    if (ts > Date.now()) return 'The date cannot be in the future.';
    if (ts - d.h.onboardedAt < 30 * DAY) return 'A follow-up needs at least 30 days after enrolment (' + fmtDate(d.h.onboardedAt) + ').';
    if (!by) return 'Enter who ran the survey.';
    SH.recordFollowup(state, hh, { payer: fd.get('payer'), pin: fd.get('pin'), internet: fd.get('internet') }, by, ts, Date.now());
    closeModal(); commit(); toast('Follow-up recorded for ' + hh);
  },
  training(fd) {
    const id = fd.get('amb'), ts = dateToTs(fd.get('date')), mods = SH.TRAINING.filter(t => fd.get('m_' + t.id));
    if (!mods.length) return 'Tick at least one module that was completed.';
    if (ts == null || ts > Date.now()) return 'Enter the date the training was completed.';
    for (const t of mods) SH.recordTraining(state, id, t.id, ui.operator, ts, Date.now());
    closeModal(); commit(); toast(plural(mods.length, 'module') + ' recorded for ' + ambName(id));
  },
  partner(fd) {
    const name = String(fd.get('name') || '').trim(); if (!name) return 'Enter the partner’s name.';
    const vs = state.villages.filter(v => fd.get('v_' + v.id)).map(v => v.id);
    if (!vs.length) return 'Choose at least one Gram Panchayat the partner covers.';
    const rec = { name, type: fd.get('type'), status: fd.get('status'), provides: String(fd.get('provides') || '').trim(), evidence: fd.get('evidence'), villages: vs.length === state.villages.length ? 'all' : vs };
    const id = fd.get('id');
    if (id) Object.assign(state.partners.find(p => p.id === id), rec); else state.partners.push(Object.assign({ id: nextId(state.partners, 'PT-', 2) }, rec));
    closeModal(); commit(); toast(id ? 'Partner saved' : name + ' added');
  },
  funding(fd) {
    const source = String(fd.get('source') || '').trim(), month = String(fd.get('month') || ''), amount = Math.round(+fd.get('amount'));
    if (!source) return 'Name the source of the funding.';
    if (!/^\d{4}-\d{2}$/.test(month) || month > SH.monthKey(Date.now())) return 'Choose the month it was received.';
    if (!(amount > 0)) return 'Enter the amount in rupees.';
    state.funding.push({ id: nextId(state.funding, 'FD-', 2), source, kind: 'demonstration', amount, month, note: String(fd.get('note') || '').trim() });
    closeModal(); commit(); toast('Funding recorded');
  },
  pricetest() { return null; },
  operator(fd) {
    const name = String(fd.get('name') || '').trim();
    if (!name) return 'Enter your name.';
    ui.operator = name; LS.set('sahaaya:operator', name); render(); toast('Name saved');
  }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-overlay')) { closeModal(); return; }
  if (t.classList && t.classList.contains('scrim')) { actions['close-drawer'](); return; }
  const el = t.closest && t.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const err = forms[f.dataset.form](new FormData(f), f);
  if (err) formError(err, f);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.set) { setPath(t.dataset.set, t.value); const g = t.dataset.set.split('.')[0]; if (ui[g] && 'page' in ui[g]) ui[g].page = 0; render(); return; }
  if (t.dataset && t.dataset.villageConn) { const v = state.villages.find(x => x.id === t.dataset.villageConn); if (v) { v.connectivity = t.value; commit(); } return; }
  if (t.dataset && t.dataset.villageEngaged) { const v = state.villages.find(x => x.id === t.dataset.villageEngaged); if (v) { v.engaged = t.checked; commit(); } return; }
  const f = t.form;
  if (f && f.dataset.form === 'session') syncSessionForm(f);
  if (t.id === 'f-arm') { const pil = t.value === 'programme'; f.querySelectorAll('[data-when-arm=programme]').forEach(x => x.hidden = !pil); }
  if (t.id === 'rp-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => { $('#rp-text').value = String(r.result || ''); reportPreview(f); }; r.readAsText(t.files[0]); }
  if (t.id === 'f-village') { const a = state.ambassadors.find(x => x.active !== false && x.village === t.value); if (a && $('#f-amb')) $('#f-amb').value = a.id; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.live) {
    setPath(t.dataset.live, t.value);
    if (t.dataset.live === 'hh.q') { ui.hh.page = 0; $('#hh-list').innerHTML = hhListHtml(); }
    else { ui.ledger.page = 0; $('#ledger-list').innerHTML = ledgerListHtml(); }
  }
  if (t.id === 'rp-text') reportPreview(t.form);
  if (t.form && t.form.dataset.form === 'pricetest') {
    const pt = state.settings.priceTest = state.settings.priceTest || {}, v = t.value === '' ? null : Math.max(0, Math.round(+t.value));
    pt[t.name] = v; state.workspace.dirty = true; persist();
    const o = $('#pt-out'); if (o) o.innerHTML = priceTestOut();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.modal) closeModal(); else if (ui.drawer) actions['close-drawer'](); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.rowlink')) e.target.click();
});
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !tipEl().hidden) showTip(t, e.clientX, e.clientY); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('.hit[data-tip]'); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top + 20); } });
document.addEventListener('focusout', hideTip);
window.addEventListener('scroll', hideTip, { passive: true });
let rz = 0, lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(drawCharts, 120); });

function route() {
  const h = location.hash.replace('#', '');
  const v = VIEWS.indexOf(h) >= 0 ? h : 'overview';
  const changed = v !== ui.view;
  ui.view = v; ui.drawer = null;
  if (ui.modal) closeModal();
  render();
  if (changed) window.scrollTo(0, 0);
  const cur = $('.nav a[aria-current]'); if (cur && cur.scrollIntoView && window.innerWidth < 900) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', () => { if (state) persistNow(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state) persistNow(); });

openWorkspace(LS.get('sahaaya:workspace') === 'live' ? 'live' : 'sample');
route();
const useCap = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
useCap('downloads').then(c => { ui.caps.downloads = c || null; });
useCap('sample').then(c => { ui.caps.sample = c || null; if (c && ui.drawer) renderDrawer(); });
window.SAHAAYA = { get state() { return state; }, get derived() { return D; }, ui };
})();
</script>
